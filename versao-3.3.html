<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Music</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--card:#111;--line:#2a2a2a;--tx:#fff;--mu:#8c8c8c;--ac:#fff;--ac2:#b5b5b5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#2c2c2c 0,#000 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.logo{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--ac);box-shadow:0 0 40px #ffffff55,0 0 90px #ffffff22;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 70px #ffffffaa,0 0 130px #ffffff44;transform:scale(1.04)}}
.name{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--ac)}
.track{width:min(60vw,240px);height:6px;border-radius:3px;background:#ffffff1c;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,var(--ac2),var(--ac));animation:load 4.5s linear forwards}
.ball{position:absolute;top:50%;left:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--ac2));box-shadow:0 0 14px var(--ac);animation:ballmove 4.5s linear forwards,spin .6s linear infinite}
.ball::after{content:"★";position:absolute;inset:0;font-size:9px;line-height:20px;text-align:center;color:#000}
@keyframes load{to{width:100%}}
@keyframes ballmove{to{left:100%}}
@keyframes spin{to{rotate:360deg}}
#app{height:100%;display:flex;flex-direction:column}
header{padding:14px 18px 8px;display:flex;align-items:center;gap:12px}
header img{width:38px;height:38px;border-radius:50%;border:2px solid var(--ac)}
header h1{font-size:20px;flex:1}
.add{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;font-weight:700;padding:9px 14px;border-radius:20px}
main{flex:1;overflow-y:auto;padding:6px 14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px}
.row:active{background:var(--card)}
.row.on{background:var(--card);outline:1px solid var(--ac)}
.ico{width:44px;height:44px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:20px;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--mu)}
.more{font-size:22px;color:var(--mu);padding:4px 8px}
.empty{text-align:center;color:var(--mu);padding:60px 24px;line-height:1.6}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.back{color:var(--ac);padding:8px 4px;font-weight:700}
nav{display:flex;border-top:1px solid var(--line);background:#0a0a0a}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--ac)}
#mini{display:none;align-items:center;gap:12px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
#mini.show{display:flex}
#mini .pp{font-size:22px;padding:6px 10px}
#full{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 14px)}
#full.show{display:flex}
#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
video{width:100%;max-height:100%;border-radius:14px;background:#000}
video.aud{width:0;height:0;position:absolute;opacity:0}
.disc{width:min(54vw,230px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--ac);box-shadow:0 0 50px #ffffff44}
.title{text-align:center;margin:14px 0 6px;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px}
input[type=range]{flex:1;accent-color:var(--ac);height:28px}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:6px 0 10px;font-size:28px}
.ctl .big{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;font-size:28px}
.vol{background:var(--card);border-radius:14px;padding:8px 14px}
.vol .top{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.vol .top b{color:var(--ac);font-size:15px}
.vol.hot .top b{color:#000;background:#fff;padding:0 7px;border-radius:6px}
#sheet{position:fixed;inset:0;z-index:40;background:#000a;display:none;align-items:flex-end}
#sheet.show{display:flex}
#sheet .box{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:70%;overflow:auto}
#sheet h3{padding:0 8px 8px}
#toast{position:fixed;left:50%;bottom:110px;translate:-50% 0;background:var(--ac);color:#000;font-weight:700;padding:9px 16px;border-radius:20px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0 10px}
@media (prefers-reduced-motion:reduce){.logo,.ball{animation-duration:4.5s}}

.ico,nav button span,.vol .top span,#miniIco,.more,.ctl button,#mini .pp{filter:grayscale(1) contrast(1.3)}
button,.row{transition:transform .12s,background .12s}
button:active,.row:active{transform:scale(.94)}
#main .row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.hold{background:#262626;transform:scale(.97);transition:transform .5s linear,background .5s linear}
.rip{position:fixed;z-index:99;pointer-events:none;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;background:#ffffff30;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(7);opacity:0}}


#stage{display:flex;flex-direction:column;align-items:center;justify-content:center}
.fsrow{width:100%;display:flex;justify-content:flex-end;padding-top:10px}
.fsb,.fsx{width:46px;height:46px;border-radius:12px;border:1px solid #ffffff66;background:#000000b0;font-size:20px}
.fsx{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:30;font-size:22px}
#full.fs{padding:0}
#full.fs .back,#full.fs .title,#full.fs .seek,#full.fs .ctl,#full.fs .vol,#full.fs .fsrow{display:none}
#full.fs #stage{flex:1;width:100%;height:100%;background:#000}
#full.fs video{width:100%;height:100%;max-height:none;border-radius:0;object-fit:contain}
#full.fs.hint .fsx{display:block}

#wave{position:absolute;left:-18px;top:0;width:calc(100% + 36px);height:100%;pointer-events:none;z-index:0}
.disc{position:relative;z-index:1;transition:transform .08s linear}
.ico img,.cvi{width:100%;height:100%;object-fit:cover;border-radius:10px}
.fsrow{gap:8px}
#covBtn{filter:grayscale(1)}

/* seleção múltipla */
#selbar{display:none;align-items:center;gap:6px;padding:14px 10px 8px}
body.selmode #selbar{display:flex}
body.selmode header{display:none}
#selbar b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selX{font-size:22px;padding:4px 8px;flex:none}
#selAll{color:var(--ac);font-weight:700;padding:6px 6px;font-size:14px;flex:none}
#selbar .add{padding:9px 12px;font-size:13px;white-space:nowrap;flex:none}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mu);flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:#000}
.row.sel{background:#1c1c1c;outline:1px solid var(--ac)}
.row.sel .chk{background:var(--ac);border-color:var(--ac)}
body.selmode .more{visibility:hidden}
</style>
</head>

<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>

<input type="file" id="dir" webkitdirectory multiple hidden>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const media=$("#media");
let tracks=[],pls=[],queue=[],cur=-1,view="lib",openFd=null,openPl=null,ctx=null,gain=null,uid=0,selMode=false;const sel=new Set();

setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),600)},4500);

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1800)}
function fmt(s){if(!isFinite(s))return"0:00";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

/* Áudio com ganho até 300% */
function initAudio(){
  if(ctx){ctx.state==="suspended"&&ctx.resume();return}
  if(+$("#vol").value<=100)return;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    ctx.onstatechange=()=>{if(ctx.state!=="running"&&!media.paused)ctx.resume().catch(()=>{})};
    const src=ctx.createMediaElementSource(media);
    gain=ctx.createGain();
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-8;comp.ratio.value=12;comp.attack.value=.003;comp.release.value=.2;
    src.connect(gain);gain.connect(comp);comp.connect(ctx.destination);
    setVol($("#vol").value);
  }catch(e){ctx=null}
}
function setVol(v){
  v=+v;if(v>100&&!ctx)initAudio();$("#volTx").textContent=v+"%";$("#volBox").classList.toggle("hot",v>200);
  if(gain)gain.gain.value=v/100;else media.volume=Math.min(1,v/100);
}
$("#vol").oninput=e=>setVol(e.target.value);

/* Importar */
$("#addBtn").onclick=()=>openSheet(`<h3>Adicionar</h3>
 <div class="row" data-a="files"><div class="ico">🎧</div><div class="tx"><b>Arquivos MP3 / MP4</b><small>Escolher do aparelho</small></div></div>
 <div class="row" data-a="dir"><div class="ico">📁</div><div class="tx"><b>Pasta inteira</b><small>Importar todas as mídias</small></div></div>`,e=>{
  const a=e.target.closest("[data-a]");if(!a)return;closeSheet();$("#"+a.dataset.a).click()});
function addFiles(list){
  let n=0;
  for(const f of list){
    if(!(/^(audio|video)\//.test(f.type)||/\.(mp3|mp4|m4a|wav|ogg|webm|mkv|mov|aac|flac)$/i.test(f.name)))continue;
    const p=f.webkitRelativePath?f.webkitRelativePath.split("/").slice(0,-1).join("/"):"Selecionados";
    tracks.push({id:++uid,name:f.name.replace(/\.[^.]+$/,""),url:URL.createObjectURL(f),folder:p||"Selecionados",video:/^video\//.test(f.type)||/\.(mp4|webm|mkv|mov)$/i.test(f.name)});n++;
  }
  toast(n?n+" adicionado(s)":"Nenhuma mídia encontrada");render();
}
$("#files").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("#dir").onchange=e=>{addFiles(e.target.files);e.target.value=""};

/* Lista */
function rowHtml(t,list,i){
  return `<div class="row ${queue[cur]===t.id?"on":""}${sel.has(t.id)?" sel":""}" data-play="${t.id}" data-list="${list}">${selMode?`<span class="chk">${sel.has(t.id)?"✓":""}</span>`:""}<div class="ico">${t.cover&&window.urlOf?`<img src="${urlOf(t.cover)}" alt="">`:(t.video?"🎬":"🎵")}</div><div class="tx"><b>${esc(t.name)}</b><small>${t.video?"MP4":"MP3"} · ${esc(t.folder)}</small></div><button class="more" data-more="${t.id}">⋮</button></div>`;
}
const webMap=new Map();let glTimer=0,glSeq=0;
const WEB_APP="ControlMusic";
function glWebRows(arr){return arr.map(t=>`<div class="row ${queue[cur]===t.id?"on":""}" data-web="${t.id}"><div class="ico">${t.art?`<img src="${esc(t.art)}" alt="" onerror="this.remove()">`:"🌐"}</div><div class="tx"><b>${esc(t.name)}</b><small>${esc(t.folder)}${t.dur?" · "+fmt(t.dur):""}</small></div><button class="more" data-dl="${t.id}" aria-label="Baixar">${t.dl?"⬇":"🔒"}</button></div>`).join("")}
function glPaintWeb(){
  const box=$("#glWeb");if(!box)return;
  const arr=window.glWebRes||[];
  box.innerHTML=`<div style="color:var(--mu);font-size:12px;padding:12px 4px 2px">🌐 ONLINE (Audius)</div>`+(arr.length?glWebRows(arr):`<div class="empty" style="padding:24px"><b>Nada encontrado online</b>Tente outro nome.</div>`);
}
async function glSearchWeb(q){
  const box=$("#glWeb");if(!box)return;
  const my=++glSeq;
  box.innerHTML=`<div class="empty" style="padding:24px"><small>🌐 Buscando online...</small></div>`;
  try{
    const r=await fetch("https://api.audius.co/v1/tracks/search?query="+encodeURIComponent(q)+"&limit=20&app_name="+WEB_APP);
    if(!r.ok)throw new Error("http "+r.status);
    const j=await r.json();
    if(my!==glSeq)return;
    const arr=(j.data||[]).filter(x=>x&&x.id&&x.is_streamable!==false&&!x.is_delete).map(x=>({
      id:"w"+x.id,name:x.title||"Sem título",web:true,video:false,
      folder:"Audius · "+((x.user&&x.user.name)||"Artista"),
      url:"https://api.audius.co/v1/tracks/"+x.id+"/stream?app_name="+WEB_APP,
      art:(x.artwork&&(x.artwork["150x150"]||x.artwork["480x480"]))||"",dur:x.duration||0,dl:x.is_downloadable===true
    }));
    arr.forEach(t=>webMap.set(t.id,t));
    window.glWebQ=q;window.glWebRes=arr;
    glPaintWeb();
  }catch(e){
    if(my!==glSeq)return;
    const b=$("#glWeb");if(b)b.innerHTML=`<div class="empty" style="padding:24px"><b>Sem conexão</b>Não consegui buscar online. Verifique a internet e tente de novo.</div>`;
  }
}
function dlWeb(id){
  const t=webMap.get(id);if(!t)return;
  if(!t.dl){toast("O artista não liberou o download desta música");return}
  const name=(t.name||"musica").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,100)+".mp3";
  const MC=mcPlugin();
  if(MC&&MC.download){
    MC.download({url:t.url,name}).then(()=>toast("Baixando... confira em Downloads")).catch(()=>toast("Não foi possível baixar"));
  }else{
    const a=document.createElement("a");a.href=t.url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    toast("Download iniciado");
  }
}
function playWeb(id){
  const ids=(window.glWebRes||[]).map(t=>t.id);
  playId(id,ids.includes(id)?ids:[id]);
}
const glNorm=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function glIds(){const q=glNorm(window.glQ);if(!q)return[];return tracks.filter(t=>glNorm(t.name+" "+t.folder).includes(q)).map(t=>t.id)}
function render(){
  const m=$("#main");let h="";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="lib"){
    $("#ttl").textContent="Músicas";

function setWaveFrom(src){

/* capa embutida: MP3 (ID3) e M4A/MP4 */
async function id3Cover(b){
  const h=new Uint8Array(await b.slice(0,10).arrayBuffer());
  if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33)return null;
  const ver=h[3],size=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);
  if(size<10||size>12e6)return null;
  const d=new Uint8Array(await b.slice(10,10+size).arrayBuffer());
  let p=0;
  if(h[5]&0x40)p=ver===4?(((d[0]&127)<<21)|((d[1]&127)<<14)|((d[2]&127)<<7)|(d[3]&127)):(((d[0]<<24)|(d[1]<<16)|(d[2]<<8)|d[3])+4);
  const hl=ver===2?6:10,il=ver===2?3:4;
  while(p+hl<=d.length){
    if(d[p]===0)break;
    const id=String.fromCharCode(...d.subarray(p,p+il));
    const fs=ver===2?((d[p+3]<<16)|(d[p+4]<<8)|d[p+5]):ver===4?(((d[p+4]&127)<<21)|((d[p+5]&127)<<14)|((d[p+6]&127)<<7)|(d[p+7]&127)):((d[p+4]<<24)|(d[p+5]<<16)|(d[p+6]<<8)|d[p+7]);
    const bo=p+hl,end=bo+fs;
    if(fs<=0||end>d.length)break;
    if(id==="APIC"||id==="PIC"){
      const enc=d[bo];let q=bo+1;
      if(id==="PIC")q+=3;else{while(q<end&&d[q]!==0)q++;q++}
      q++;
      if(enc===0||enc===3){while(q<end&&d[q]!==0)q++;q++}else{while(q+1<end&&!(d[q]===0&&d[q+1]===0))q+=2;q+=2}
      const img=d.slice(q,end);
      if(img.length>100)return new Blob([img],{type:img[0]===0x89?"image/png":"image/jpeg"});
    }
    p=end;
  }
  return null;
}
function findCovr(u){
  let p=0;const dv=new DataView(u.buffer,u.byteOffset,u.byteLength);
  while(p+8<=u.length){
    const sz=dv.getUint32(p),ty=String.fromCharCode(u[p+4],u[p+5],u[p+6],u[p+7]);
    if(sz<8||p+sz>u.length)break;
    const inner=u.subarray(p+8,p+sz);
    if(ty==="covr"){if(inner.length>100){const img=inner.slice(16);return new Blob([img],{type:img[0]===0x89?"image/png":"image/jpeg"})}}
    else if(ty==="udta"||ty==="ilst"){const r=findCovr(inner);if(r)return r}
    else if(ty==="meta"){const r=findCovr(inner.subarray(4));if(r)return r}
    p+=sz;
  }
  return null;
}
async function mp4Cover(b){
  const rd=async(o,n)=>new DataView(await b.slice(o,o+n).arrayBuffer());
  let o=0,first=true;
  while(o+16<=b.size){
    const v=await rd(o,16);let sz=v.getUint32(0),hdr=8;
    const ty=String.fromCharCode(v.getUint8(4),v.getUint8(5),v.getUint8(6),v.getUint8(7));
    if(first&&ty!=="ftyp")return null;first=false;
    if(sz===1){sz=v.getUint32(8)*4294967296+v.getUint32(12);hdr=16}else if(sz===0)sz=b.size-o;
    if(sz<8)return null;
    if(ty==="moov"){if(sz>16e6)return null;const u=new Uint8Array(await b.slice(o+hdr,o+sz).arrayBuffer());return findCovr(u)||(()=>{let r=null;const walk=x=>{r=r||findCovr(x)};walk(u);return r})()}
    o+=sz;
  }
  return null;
}
async function embeddedCover(b){try{return (await id3Cover(b))||(await mp4Cover(b))}catch(e){return null}}
let scanning=false,scanT=0;
async function scanCovers(){
  if(scanning||!window.__restored)return;scanning=true;let found=false;
  try{
    for(const t of tracks.slice()){
      if(t.cover!==undefined)continue;
      let c=null;
      try{c=await embeddedCover(await (await fetch(t.url)).blob())}catch(e){}
      t.cover=c;saveCover(t);if(c)found=true;
    }
  }catch(e){}
  scanning=false;
  if(found){render();updateDisc()}
}
const _r4=render;
window.render=function(){_r4();clearTimeout(scanT);scanT=setTimeout(scanCovers,500)};
window.__ready.then(()=>setTimeout(scanCovers,300));

/* escolher foto da galeria */
const covIn=document.createElement("input");covIn.type="file";covIn.accept="image/*";covIn.hidden=true;document.body.appendChild(covIn);
let covTarget=null;
async function shrink(f){
  try{
    const bm=await createImageBitmap(f),k=Math.min(1,640/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||f),"image/jpeg",.86));
  }catch(e){return f}
}
covIn.onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!covTarget)return;
  const blob=await shrink(f),tg=covTarget;covTarget=null;
  if(tg.t){tg.t.cover=blob;saveCover(tg.t)}else if(tg.p){tg.p.cover=blob}
  saveMeta();render();updateDisc();toast("Foto aplicada");
};
function coverSheet(title,has,onPick,onRemove){
  openSheet(`<h3>${esc(title)}</h3><div class="row" data-a="pick"><div class="ico">🖼</div><div class="tx"><b>Escolher foto da galeria</b></div></div>`+(has?`<div class="row" data-a="rm"><div class="ico">🗑</div><div class="tx"><b>Remover foto</b></div></div>`:""),e=>{
    const a=e.target.closest("[data-a]");if(!a)return;closeSheet();
    a.dataset.a==="pick"?onPick():onRemove();
  });
}
document.querySelector("#covBtn").onclick=()=>{
  const t=curT();if(!t)return;
  coverSheet(t.name,!!t.cover,()=>{covTarget={t};covIn.click()},()=>{t.cover=null;saveCover(t);render();updateDisc()});
};
mainEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-plmore]");if(!b)return;
  e.stopPropagation();const p=pls[+b.dataset.plmore];
  coverSheet(p.name,!!p.cover,()=>{covTarget={p};covIn.click()},()=>{p.cover=null;saveMeta();render();updateDisc()});
},true);

/* ondas saindo da imagem */
const wv=document.createElement("canvas");wv.id="wave";stg.insertBefore(wv,stg.firstChild);
const wctx=wv.getContext("2d");let wrun=false,wlast=0,rips=[],lastBeat=-9;

function wstop(){wrun=false;wctx.clearRect(0,0,wv.width,wv.height);disc.style.transform=""}
function wframe(ts){

<script>
/* Seleção múltipla: segure 0,5 s numa música */
function selUI(){
  document.body.classList.toggle("selmode",selMode);
  $("#selCnt").textContent=sel.size+(sel.size===1?" selecionada":" selecionadas");
}
function startSel(id){
  if(selMode)return;
  selMode=true;sel.clear();sel.add(id);
  try{history.pushState({sel:1},"")}catch(_){}
  selUI();render();
}
function exitSel(fromPop){
  if(!selMode)return;
  selMode=false;sel.clear();selUI();render();
  if(!fromPop&&history.state&&history.state.sel)history.back();
}
function toggleSel(id,row){
  sel.has(id)?sel.delete(id):sel.add(id);
  if(!sel.size)return exitSel();
  if(row){row.classList.toggle("sel",sel.has(id));const c=row.querySelector(".chk");if(c)c.textContent=sel.has(id)?"✓":""}
  selUI();
}
window.addEventListener("popstate",()=>{if(selMode)exitSel(true)});
$("#selX").onclick=()=>exitSel();
$("#selAll").onclick=()=>{
  const ids=[...document.querySelectorAll("#main [data-play]")].map(r=>+r.dataset.play);
  const all=ids.length&&ids.every(i=>sel.has(i));
  ids.forEach(i=>all?sel.delete(i):sel.add(i));
  if(!sel.size)return exitSel();
  selUI();render();
};
const selIds=()=>tracks.filter(t=>sel.has(t.id)).map(t=>t.id);
function addSelTo(i){
  const p=pls[i],ids=selIds();let n=0;
  ids.forEach(id=>{if(!p.ids.includes(id)){p.ids.push(id);n++}});
  exitSel();toast(n+" adicionada(s) a "+p.name);
}
$("#selPl").onclick=()=>{
  if(!sel.size)return;
  openSheet(`<h3>Enviar ${sel.size} para playlist</h3>`+pls.map((p,i)=>`<div class="row" data-add="${i}"><div class="ico">📑</div><div class="tx"><b>${esc(p.name)}</b><small>${p.ids.length} faixa(s)</small></div></div>`).join("")+`<div class="row" data-new="1"><div class="ico">＋</div><div class="tx"><b>Nova playlist</b></div></div>`,e=>{
    const a=e.target.closest("[data-add]"),n=e.target.closest("[data-new]");
    if(a){closeSheet();addSelTo(+a.dataset.add)}
    else if(n){closeSheet();newPlaylist(i=>addSelTo(i))}
  });
};
$("#selDel").onclick=()=>{
  if(!sel.size)return;const k=sel.size;
  openSheet(`<h3>${k} música(s) selecionada(s)</h3>`+(openPl!=null?`<div class="row" data-x="pl"><div class="ico">➖</div><div class="tx"><b>Remover desta playlist</b><small>Continuam na biblioteca</small></div></div>`:"")+`<div class="row" data-x="lib"><div class="ico">🗑</div><div class="tx"><b>Apagar do app</b><small>Remove da biblioteca e de todas as playlists</small></div></div><div class="row" data-x="no"><div class="ico">✕</div><div class="tx"><b>Cancelar</b></div></div>`,e=>{
    const x=e.target.closest("[data-x]");if(!x)return;closeSheet();
    const ids=selIds();
    if(x.dataset.x==="lib"){ids.forEach(id=>window.delTrack(id));exitSel();toast(k+" apagada(s)")}
    else if(x.dataset.x==="pl"){pls[openPl].ids=pls[openPl].ids.filter(i=>!sel.has(i));exitSel();toast(k+" removida(s) da playlist")}
  });
};
</script>
